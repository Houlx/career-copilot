[project]
name = "career-copilot"
version = "0.1.0"
description = "Workflow-first Career Copilot — Phase 1 foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-socket>=0.7,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/career_copilot"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
